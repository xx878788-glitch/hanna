ss="result" hidden aria-live="polite"></section><aside class="story"><h2>Hanna 想對妳說的話</h2><p>小時候有些委屈，我沒有跟家裡說。現在當了媽媽，我更希望孩子知道，遇到事情可以開口，我會陪他一起面對。</p><p>我也曾經把自己武裝得很堅強，怕別人發現我也會害怕。後來才慢慢學著面對自己的感受，不用每次都一個人撐著。</p><p>如果妳也一邊照顧孩子，一邊學著照顧自己，我想把我的故事分享給妳。</p><a href="https://xx878788-glitch.github.io/kk/hanna-story/" target="_blank" rel="noopener">看看Hanna故事 →</a></aside><p class="disclaimer">這是一份趣味自我探索，選擇沒有好壞之分<br>內容不代表心理評估、人格判定</p></main><script>
const data=[["A", "存錢筒", "妳總想多準備一點，讓他少受一點委屈", "孩子還沒開口，妳已經先想到他可能會需要什麼。出門會多帶一件衣服，行程會先想好備案，嘴上說「以防萬一」，心裡想的是：真的發生什麼事，至少我還能替他做點什麼。", "妳不一定常把愛掛在嘴邊，但會記得他的習慣，把小事一件件放在心上。別人看到的是妳很會安排，妳自己知道，有時候連休息都很難真正放心。", "最讓妳累的，可能是事情明明已經處理好了，腦袋卻還在問：「這樣真的夠了嗎？」妳也希望有人主動對妳說，剩下的交給我。", "今天試著把一件小事交給別人，不急著提醒，也不立刻接手。讓自己親眼看見，少操心一點，生活依然能好好往前走。", "妳可以是孩子的依靠，也可以有需要被接住的時候。"], ["B", "一本書", "妳希望他有自己的想法，也怕自己替他想得太多", "比起孩子照著妳的話做，妳更想知道他為什麼這樣想。他問問題時，妳願意解釋；他遇到困難時，妳希望他慢慢找到方法。看見他突然懂了的表情，會讓妳特別開心。", "妳會觀察他的興趣，也願意陪他從不會到會。妳在意的往往不只是結果，還有他有沒有因為一次失敗，就覺得自己很差。", "只是看他卡住太久，妳還是會忍不住提示，甚至把下一步都安排好。妳想讓他獨立，又捨不得看他繞遠路，常常就在這兩種心情之間拉扯。", "下次想替他回答時，先多等一下，問一句「你想怎麼試？」容許他的做法跟妳不同，也容許事情暫時沒有答案。", "妳願意聽他的想法，就已經在給他長出自己的空間。"], ["C", "一把鑰匙", "妳最想給他的，是不用看臉色的安心", "妳希望他回到家能放鬆，做錯事敢說，受委屈也不用先想會不會被罵。對妳來說，家裡有人願意聽他把話說完，是很重要的事。", "妳很容易察覺家人的情緒。誰突然安靜了、語氣不太一樣，妳常常第一個發現，也會下意識想讓氣氛好一點。", "但一直留意別人，妳自己的感受有時就往後放了。明明也累，也有不開心，卻會說「沒事」，等大家都睡了，才發現自己其實有很多話想說。", "找一個平靜的時候，也說說妳今天的心情。讓孩子知道，媽媽會難過、會需要休息，一家人可以互相照顧。", "妳想給孩子的那份安心，也應該有妳的位置。"], ["D", "一雙鞋", "妳希望他走自己的路，又捨不得他走得太遠", "妳想讓孩子試試不同的事，看看外面的世界。聽到他說「我想試試看」，妳會替他期待，即使心裡也會擔心他跌倒、受挫，或有一天不再需要妳。", "妳願意陪他嘗試，也珍惜他每個新的發現。妳想保護他的好奇心，不希望他還沒開始，就先覺得自己不行。", "真正難的，可能是他選了妳不熟悉、甚至不太認同的方向。妳知道要放手，卻也會忍不住想：如果他受傷了，我是不是應該早一點攔住他？", "從一個小選擇開始，讓他自己決定，也陪他面對結果。不急著說「我早就說過」，先聽他說這次發現了什麼。", "讓他知道，往前走的時候有人祝福，想回頭的時候也有人在。"]];const choices=document.querySelector('#choices'),result=document.querySelector('#result');
